<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unread · Pick topics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F12}
a{color:#8FB8FF}a:hover{color:#B9D2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #F2F3F5; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 28px; gap: 24px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font: 500 12px 'Geist Mono', monospace; color: #A3A8B3">STEP 1 OF 2</span>
    <a href="Main.dc.html" style="font-size: 14px; text-decoration: none; padding: 12px 0">Skip</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em">What should we catch you up on?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #A3A8B3">Pick a few. Each morning we turn the latest stories and your saved links into one short episode.</p>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; background: #17181D; border: 1px solid #2A2D35; border-radius: 14px; padding: 0 14px; height: 48px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
    <span style="position: absolute; left: -9999px">Search topics</span>
    <input type="search" placeholder="Search any topic, team or place" style="flex: 1; background: transparent; border: 0; color: #F2F3F5; font: 400 15px Geist, sans-serif; outline: none">
  </label>

  <div role="group" aria-label="Topics" style="display: flex; flex-wrap: wrap; gap: 10px">
    <sc-for list="{{topics}}" as="topic" hint-placeholder-count="12">
      <sc-if value="{{topic.on}}" hint-placeholder-val="{{ false }}">
        <button aria-pressed="true" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{accent}}; background: {{accentSoft}}; color: #F2F3F5; font: 500 14px Geist, sans-serif; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{topic.label}}</button>
      </sc-if>
      <sc-if value="{{topic.off}}" hint-placeholder-val="{{ true }}">
        <button aria-pressed="false" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A2D35; background: #17181D; color: #D6D9DF; font: 500 14px Geist, sans-serif; cursor: pointer">{{topic.label}}</button>
      </sc-if>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #D6D9DF">Episode length</span>
      <div role="radiogroup" aria-label="Episode length" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #2A2D35; background: #17181D; color: #D6D9DF; font: 500 14px Geist, sans-serif">5 min</button>
        <button role="radio" aria-checked="true" style="height: 44px; border-radius: 12px; border: 1px solid {{accent}}; background: {{accentSoft}}; color: #F2F3F5; font: 600 14px Geist, sans-serif">15 min</button>
        <button role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #2A2D35; background: #17181D; color: #D6D9DF; font: 500 14px Geist, sans-serif">30 min</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #17181D; border: 1px solid #2A2D35; border-radius: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #A3A8B3">News edition</span>
        <span style="font-size: 15px; font-weight: 500">United States · English</span>
      </div>
      <button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #8FB8FF; font: 500 14px Geist, sans-serif; cursor: pointer">Change</button>
    </div>
    <a href="Sources.dc.html" style="height: 54px; border-radius: 27px; background: {{accent}}; color: #0A1A33; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue · 5 topics</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B9BFF","options":["#5B9BFF","#7DD3A8","#F5B547","#F08A7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#5B9BFF';
    const picked = ['AI', 'Startups', 'Football', 'Personal finance', 'Science'];
    const labels = ['AI', 'Startups', 'Football', 'Markets', 'Personal finance', 'Science', 'Climate', 'Design', 'Health', 'Gaming', 'Space', 'Film & TV'];
    return {
      accent,
      accentSoft: accent + '26',
      topics: labels.map((label) => ({ label, on: picked.includes(label), off: !picked.includes(label) }))
    };
  }
}
</script>
</body>
</html>
